name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  token-tests:
    name: TokenTests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-latest
            name: Linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JUCE's gui modules need system dev packages on Linux. webkit and curl are
      # omitted (the targets set JUCE_WEB_BROWSER=0, JUCE_USE_CURL=0).
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev
          # FreeType package was renamed across Ubuntu releases; accept either name.
          sudo apt-get install -y libfreetype-dev || sudo apt-get install -y libfreetype6-dev

      # The top-level build fetches JUCE (see CMakeLists.txt) and enables the tests.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # Only the test target: the gallery app and snapshot tool are not needed here.
      - name: Build TokenTests
        run: cmake --build build --config Release --parallel 4 --target ZqsfxUiTokenTests ZqsfxUiDialTests ZqsfxUiFocusRingTests ZqsfxUiUpdateTests ZqsfxUiValueEntryTests ZqsfxUiRestingDisplayTests ZqsfxUiPeakMeterTests ZqsfxUiAboutBoxTests

      # TokenTests: WCAG contrast of every token pair plus colour-blind simulation.
      - name: Run TokenTests
        run: ctest --test-dir build -C Release --output-on-failure

      # A test that crashes prints no reason. On Linux, rerun each failed one under gdb so the
      # log shows where it died.
      - name: Backtrace failed tests (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb
          for t in $(ctest --test-dir build -N | sed -n 's/^ *Test *#[0-9]*: //p'); do
            exe=$(find build -type f -name "ZqsfxUi${t}" -perm -u+x | head -1)
            [ -n "$exe" ] || continue
            if ! "$exe" > /dev/null 2>&1; then
              echo "=== $t ==="
              gdb -batch -ex run -ex bt -ex "info threads" "$exe" 2>&1 | tail -60
            fi
          done
